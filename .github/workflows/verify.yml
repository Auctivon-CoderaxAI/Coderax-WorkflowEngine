name: verify

# The permanent acceptance gate. Every job runs on a standard, free
# GitHub-hosted runner. No paid runner, action or service is used.
#
# The repository protects `main` with the required check named `verify`. The real
# MongoDB lane must therefore live inside this job, not in a sibling job that the
# required check cannot see. The service is an ephemeral, pinned database with no
# production credentials.

# The multimodal layer is stacked on the authoritative router branch, so the
# same gate must run for that base and for the stacked branch's own pushes until
# the router lands on main. Remove both stack-scoped entries when it does.
on:
  pull_request:
    branches: [main, feat/zero-cost-model-router]
  push:
    branches: [main, feat/multimodal-creative-intelligence]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: npm

      - name: Install from the lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript compilation (tsc -b, project references)
        run: npm run build

      - name: SDK distribution artifacts (deterministic)
        run: node dist/scripts/pack-sdk.js

      - name: Tests (unit, contract, integration, security, e2e)
        run: node --test "dist/tests/**/*.test.js"

      - name: Integration tests (fake MongoDB explicitly labelled)
        run: node dist/scripts/run-gates.js integration

      - name: Security regression tests
        run: node dist/scripts/run-gates.js security

      - name: Adversarial execution tests
        run: node dist/scripts/run-gates.js adversarial

      - name: Route, SDK and OpenAPI contract tests
        run: node dist/scripts/run-gates.js contract

      - name: OpenAPI drift detection
        run: node dist/scripts/run-gates.js openapi

      - name: Dependency wiring, ownership and unused capability detection
        run: node dist/scripts/run-gates.js architecture

      - name: Package artifact integrity
        run: node dist/scripts/run-gates.js artifacts

      - name: End-to-end API-to-engine tests
        run: node dist/scripts/run-gates.js e2e

      - name: Dependency vulnerability scan (high and critical)
        run: node dist/scripts/run-gates.js audit

      - name: Real MongoDB integration tests (required, no fake)
        run: node dist/scripts/run-gates.js mongo-live

      - name: Reject committed secrets and local owner paths
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            -E '(CODERAX_OWNER_TOKEN|CODERAX_INFERENCE_KEY)=[A-Za-z0-9]' .; then
            echo "A secret value appears to be committed."
            exit 1
          fi
          echo "No committed secret values found."

  # Durability and concurrency are only proven by a real server, and a skipped
  # test is not a pass. This lane supplies a pinned MongoDB and sets
  # CODERAX_REQUIRE_MONGODB=1, which turns "no real server" into a failure, so
  # the real-database tests cannot silently disappear from the gate.
  mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CODERAX_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      CODERAX_REQUIRE_MONGODB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (TypeScript project references)
        run: npm run build

      - name: SDK distribution artifacts (deterministic)
        run: node dist/scripts/pack-sdk.js

      - name: Tests against a real MongoDB (skips are failures)
        run: node --test "dist/tests/**/*.test.js"
