name: verify

# The acceptance gate. A passing run at an earlier head is not a pass, so this
# runs on every push to a pull request and on main after merge.
#
# Every job uses a standard GitHub-hosted runner (ubuntu-latest). No larger
# runner, paid action, matrix expansion or purchased minute is used. Runs are
# triggered by a pull request, a push to main, or a push to a ci/** gate branch;
# a feature-branch push alone does not start one. See docs/quality-gate.md.

on:
  pull_request:
    branches: [main]
  push:
    # Gate branches verify on push so a change to the gate itself is proven at
    # its exact head before it starts rejecting other branches. A feature-branch
    # push alone is not a request for acceptance; its pull request is.
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: npm

      - name: Install (locked, lifecycle scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # TypeScript compilation is the typecheck: tsc -b across contracts, SDK
      # and engine project references.
      - name: TypeScript compilation
        run: npm run build

      - name: Unit tests
        run: node --test "dist/tests/unit/*.test.js"

      - name: Contract tests
        run: node --test "dist/tests/contract/*.test.js"

      - name: Integration tests (fencing, crash recovery, event replay)
        run: node --test "dist/tests/integration/*.test.js"

      - name: Security regression tests (isolation, cost policy, approvals)
        run: node --test "dist/tests/security/*.test.js"

      - name: Adversarial execution tests
        run: node --test "dist/tests/adversarial/*.test.js"

      - name: Architecture regression tests (contracts, routes, SDK, dependency wiring)
        run: node --test "dist/tests/architecture/*.test.js"

      - name: End-to-end tests
        run: node --test "dist/tests/e2e/*.test.js"

      - name: OpenAPI drift
        run: npm run gate:openapi

      - name: Route registration completeness
        run: npm run gate:registration

      - name: SDK compatibility
        run: npm run gate:sdk

      - name: Architecture boundaries and single ownership
        run: npm run gate:structure

      - name: Capability authority (TypeScript semantic analysis)
        run: npm run gate:authority

      - name: Gate coverage (every compiled test is executed)
        run: npm run gate:coverage

      - name: Unused and disconnected capability detection
        run: npm run gate:reachability

      - name: Dependency manifests and lockfile integrity
        run: npm run gate:dependencies

      - name: Package artifact integrity
        run: npm run gate:artifacts

      - name: Release manifest compatibility
        run: npm run gate:release

      - name: Package dry-run (metadata is packable)
        run: |
          npm pack --dry-run --workspace @coderax/contracts
          npm pack --dry-run --workspace @coderax/sdk

      - name: Reject committed secrets and local paths
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            -E '(CODERAX_OWNER_TOKEN|CODERAX_INFERENCE_KEY)=[A-Za-z0-9]' .; then
            echo "A secret value appears to be committed."
            exit 1
          fi
          echo "No committed secret values found."

  database-regression:
    name: real MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CODERAX_TEST_MONGO_URI: mongodb://127.0.0.1:27017/coderax_gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: npm

      - name: Install (locked, lifecycle scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The fake collection suite is named separately so a green run here can
      # never be read as live database evidence.
      - name: Fake-collection persistence suites (not a database)
        run: npm run test:mongo:fake

      - name: Real MongoDB integration
        run: npm run test:mongo:live

  vulnerabilities:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: npm

      - name: Install (locked, lifecycle scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate is compiled TypeScript, so this job needs the build even though
      # it runs no test. Without it the audit step exits before scanning.
      - name: TypeScript compilation
        run: npm run build

      # High and critical advisories fail the gate. A documented exception is
      # not used: an advisory is fixed by upgrading, not by ignoring it. The
      # machine-readable gate refuses to pass when it cannot obtain audit
      # metadata, and one call audits the complete tree including runtime
      # dependencies.
      - name: Audit the complete installed tree
        run: npm run gate:audit
