name: verify

# The acceptance gate. A passing run at an earlier head is not a pass, so the
# workflow runs on every push to a pull request and on main after merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A permanent, real MongoDB lane. The durable tests refuse to skip when
    # CODERAX_REQUIRE_MONGODB=1, so a missing or unreachable service fails the
    # required check instead of reporting a green skip. This is a service
    # container on the existing runner: no managed database is added.
    services:
      mongodb:
        # Pinned by digest, not by `mongo:7.0`: a moving tag would let an
        # upstream image change decide whether this check passes. This is the
        # OCI index for mongo:7.0 (linux/amd64 + linux/arm64) resolved on
        # 2026-11-26; the runner pulls linux/amd64.
        image: mongo@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (TypeScript project references)
        run: npm run build

      - name: Tests (unit, contract, integration, security, e2e, real MongoDB state)
        env:
          CODERAX_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          CODERAX_REQUIRE_MONGODB: '1'
        run: node --test "dist/tests/**/*.test.js"

      - name: Contract drift gate
        run: npm run openapi:check

      - name: SDK artifact drift gate
        run: npm run sdk:check

      - name: Reject committed secrets and local paths
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            -E '(CODERAX_OWNER_TOKEN|CODERAX_INFERENCE_KEY)=[A-Za-z0-9]' .; then
            echo "A secret value appears to be committed."
            exit 1
          fi
          echo "No committed secret values found."
