name: verify

# The acceptance gate. A passing run at an earlier head is not a pass, so the
# workflow runs on every push to a pull request and on main after merge.

on:
  pull_request:
    branches: [main]
  push:
    # The consolidation branch publishes hosted evidence before a pull request
    # exists. Remove this branch once the pull request supplies its own runs.
    branches: [main, integration/authoritative-runtime]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mongo:
    # A required lane: the test script sets CODERAX_REQUIRE_MONGODB=1, so a
    # missing service fails the job instead of reporting a skipped check. The
    # database is an ephemeral CI container, never a production deployment.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CODERAX_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (TypeScript project references)
        run: npm run build

      - name: Restart, two-replica, lease, grant and retention evidence
        run: npm run test:mongo

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (TypeScript project references)
        run: npm run build

      - name: SDK distribution artifacts (deterministic)
        run: node dist/scripts/pack-sdk.js

      - name: Tests (unit, contract, integration, security, e2e)
        run: node --test "dist/tests/**/*.test.js"

      - name: Contract drift gate
        run: npm run openapi:check

      - name: Package checksums
        working-directory: dist-artifacts
        run: sha256sum -c SHA256SUMS

      - name: Upload SDK distribution
        uses: actions/upload-artifact@v4
        with:
          name: coderax-sdk-1.1.0
          path: dist-artifacts/
          if-no-files-found: error

      - name: Reject committed secrets and local paths
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            -E '(CODERAX_OWNER_TOKEN|CODERAX_INFERENCE_KEY)=[A-Za-z0-9]' .; then
            echo "A secret value appears to be committed."
            exit 1
          fi
          echo "No committed secret values found."
