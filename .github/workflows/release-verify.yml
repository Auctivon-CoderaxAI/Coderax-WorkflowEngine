name: release-verify

# Release gate. It runs the same acceptance checks as `verify`, then evaluates
# the pinned compatibility matrix and the client CI attestation. It never
# deploys, never reads a production secret and has no write permission.
#
# Hosted Actions is billing-blocked on this repository; while that is true this
# workflow does not run. A required check that cannot start is not a pass.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'release/**'
      - 'scripts/release/**'
      - '.github/workflows/release-verify.yml'

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verify:
    name: Release compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: npm

      - name: Install the frozen workspace
        run: npm ci

      - name: Acceptance verification
        run: npm run verify

      - name: Release compatibility matrix
        run: npm run release:verify -- --online
